document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

r: #ffcf6b; text-decoration: none; }\n  a:hover { color: #ffe0a3; }\n  @keyframes bd-sonar { 0% { transform: scale(.55); opacity: .9; } 100% { transform: scale(1.7); opacity: 0; } }\n  @keyframes bd-pop { 0% { transform: scale(.4) translateY(6px); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }\n  @keyframes bd-shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }\n  @keyframes bd-float { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }\n  @keyframes bd-fly { 0% { transform: translate(0,0) scale(.6); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--fx), var(--fy)) scale(1.1) rotate(var(--fr)); opacity: 0; } }\n  @keyframes bd-rise { from { transform: translateY(14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }\n  @keyframes bd-glow { 0%,100% { text-shadow: 0 0 18px rgba(181,129,255,.45); } 50% { text-shadow: 0 0 34px rgba(181,129,255,.85); } }\n  @keyframes bd-flash { 0% { opacity: 0; transform: scale(.65); } 38% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0; transform: scale(1); } }\n  @keyframes bd-banner { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.8); } 18% { opacity: 1; transform: translate(-50%, 0) scale(1.04); } 32% { transform: translate(-50%, 0) scale(1); } 72% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -22px) scale(1); } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh; width:100%; background:radial-gradient(120% 90% at 50% -10%, #1a1140 0%, #0c0820 45%, #08060f 100%); color:#ece7ff; font-family:'Space Grotesk',system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; padding:24px 16px 40px; -webkit-tap-highlight-color:transparent;\">\n\n  <!-- ================= MENU ================= -->\n  <sc-if value=\"{{ showMenu }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"width:100%; max-width:640px; margin:auto; display:flex; flex-direction:column; align-items:center; gap:26px; animation:bd-rise .5s ease;\">\n      <div style=\"text-align:center; margin-top:14px;\">\n        <div style=\"font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:clamp(48px,13vw,88px); line-height:.92; letter-spacing:2px; color:#ece7ff; animation:bd-glow 3.4s ease-in-out infinite;\">BATDUKO<\u002Fdiv>\n        <div style=\"margin-top:12px; color:#b3a9de; font-size:clamp(14px,3.6vw,17px); letter-spacing:.5px;\">Sudoku is asleep. The cave is awake.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"width:100%; display:flex; flex-direction:column; gap:12px;\">\n        <div style=\"text-transform:uppercase; letter-spacing:2.5px; font-size:12px; color:#8f86bd; font-weight:600; padding-left:2px;\">Descend into a cave<\u002Fdiv>\n        <button onclick=\"{{ startRoost }}\" style=\"all:unset; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:14px; padding:18px 20px; border-radius:16px; background:linear-gradient(135deg,rgba(51,214,195,.14),rgba(51,214,195,.04)); border:1px solid rgba(51,214,195,.35); transition:transform .12s ease;\" style-hover=\"transform:translateY(-2px); background:linear-gradient(135deg,rgba(51,214,195,.22),rgba(51,214,195,.07));\">\n          <div><div style=\"font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:20px; color:#7ff0e2;\">Roost<\u002Fdiv><div style=\"font-size:13px; color:#a9a1d4;\">Warm-up \u00b7 22 clues shown<\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size:26px;\">\ud83c\udf3f<\u002Fdiv>\n        <\u002Fbutton>\n        <button onclick=\"{{ startTwilight }}\" style=\"all:unset; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:14px; padding:18px 20px; border-radius:16px; background:linear-gradient(135deg,rgba(181,129,255,.16),rgba(181,129,255,.04)); border:1px solid rgba(181,129,255,.4); transition:transform .12s ease;\" style-hover=\"transform:translateY(-2px); background:linear-gradient(135deg,rgba(181,129,255,.26),rgba(181,129,255,.08));\">\n          <div><div style=\"font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:20px; color:#cbb0ff;\">Twilight<\u002Fdiv><div style=\"font-size:13px; color:#a9a1d4;\">Standard \u00b7 16 clues shown<\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size:26px;\">\ud83c\udf18<\u002Fdiv>\n        <\u002Fbutton>\n        <button onclick=\"{{ startMidnight }}\" style=\"all:unset; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:14px; padding:18px 20px; border-radius:16px; background:linear-gradient(135deg,rgba(255,95,126,.16),rgba(255,95,126,.04)); border:1px solid rgba(255,95,126,.4); transition:transform .12s ease;\" style-hover=\"transform:translateY(-2px); background:linear-gradient(135deg,rgba(255,95,126,.26),rgba(255,95,126,.08));\">\n          <div><div style=\"font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:20px; color:#ff8ba3;\">Midnight<\u002Fdiv><div style=\"font-size:13px; color:#a9a1d4;\">Champion \u00b7 11 clues shown<\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size:26px;\">\ud83e\ude78<\u002Fdiv>\n        <\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"width:100%; display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-radius:14px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08);\">\n        <div style=\"font-size:12px; text-transform:uppercase; letter-spacing:2px; color:#8f86bd;\">Best flight<\u002Fdiv>\n        <div style=\"text-align:right; font-family:'Chakra Petch',sans-serif; font-weight:600;\">{{ bestLine }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"width:100%; padding:18px 20px; border-radius:16px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08); font-size:13.5px; line-height:1.65; color:#c4bce6;\">\n        <div style=\"font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:15px; color:#ece7ff; margin-bottom:8px; letter-spacing:.5px;\">How the cave works<\u002Fdiv>\n        <div>Fill the 6\u00d76 grid so every cell holds a <b style=\"color:#fff;\">bat species<\u002Fb> and a <b style=\"color:#fff;\">colony size (1\u20136)<\u002Fb>.<\u002Fdiv>\n        <div style=\"margin-top:8px; display:flex; flex-direction:column; gap:5px;\">\n          <div>\u2022 Each <b style=\"color:#cbb0ff;\">row, column &amp; cave<\u002Fb> uses all 6 species and all 6 sizes once.<\u002Fdiv>\n          <div>\u2022 <b style=\"color:#7ff0e2;\">Sonar clash:<\u002Fb> same colony size can't touch edge-to-edge.<\u002Fdiv>\n          <div>\u2022 <b style=\"color:#ff8ba3;\">Wing clip:<\u002Fb> same species can't touch diagonally.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12px; color:#6f679a; text-align:center;\">Tap a cell \u2192 pick a bat \u2192 pick a size. Optimised for touch &amp; mouse.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ================= PLAY ================= -->\n  <sc-if value=\"{{ showPlay }}\">\n    <div style=\"width:100%; max-width:560px; margin:auto; display:flex; flex-direction:column; gap:14px;\">\n      <!-- HUD -->\n      <div style=\"display:flex; align-items:stretch; gap:8px;\">\n        <div style=\"flex:1; padding:10px 12px; border-radius:12px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08);\">\n          <div style=\"font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#8f86bd;\">Time<\u002Fdiv>\n          <div style=\"font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:22px;\">{{ timeStr }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1.2; padding:10px 12px; border-radius:12px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08);\">\n          <div style=\"font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#8f86bd;\">Score<\u002Fdiv>\n          <div style=\"font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:22px; color:#ffcf6b;\">{{ score }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1; padding:10px 12px; border-radius:12px; background:{{ comboBg }}; border:1px solid rgba(181,129,255,.4); position:relative; overflow:hidden;\">\n          <div style=\"font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#8f86bd;\">Combo<\u002Fdiv>\n          <div style=\"font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:22px; color:#cbb0ff;\">{{ comboStr }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- BOARD + FLANKING HALF-DIALS -->\n      <div style=\"display:flex; align-items:stretch; justify-content:center; gap:4px; width:100%;\">\n        <!-- LEFT DIAL \u00b7 sizes (scroll to spin) -->\n        <div onwheel=\"{{ onWheelSize }}\" title=\"Scroll to spin sizes\" style=\"position:relative; width:84px; align-self:stretch; flex:0 0 auto; cursor:ns-resize; overscroll-behavior:contain; touch-action:none;\">\n          <sc-for list=\"{{ numberDial }}\" as=\"d\" hint-placeholder-count=\"6\">\n            <button onclick=\"{{ d.onClick }}\" data-nsz=\"{{ d.n }}\" style=\"{{ d.style }}\">{{ d.n }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <!-- BOARD -->\n        <div style=\"position:relative; flex:1 1 auto; min-width:0; max-width:340px; padding:5px; border-radius:16px; background:rgba(0,0,0,.35); border:2px solid rgba(181,129,255,.5); box-shadow:0 20px 50px rgba(0,0,0,.5), inset 0 0 40px rgba(181,129,255,.06);\">\n        <div style=\"display:grid; grid-template-columns:repeat(6,1fr); grid-template-rows:repeat(6,1fr); aspect-ratio:1/1; width:100%;\">\n          <sc-for list=\"{{ cells }}\" as=\"cell\" hint-placeholder-count=\"36\">\n            <div style=\"{{ cell.cellStyle }}\" data-cidx=\"{{ cell.cidx }}\" onclick=\"{{ cell.onClick }}\">\n              <sc-if value=\"{{ cell.showBat }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"{{ cell.tokenStyle }}\">\n                  {{ cell.face }}\n                  <div style=\"{{ cell.numStyle }}\">{{ cell.num }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ cell.showPulse }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"{{ cell.pulseStyle }}\"><\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ cell.showCelebrate }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"{{ cell.celebStyle }}\"><\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ celebActive }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"{{ celebBanner }}\">{{ celebText }}<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n        <!-- RIGHT DIAL \u00b7 species (scroll to spin) -->\n        <div onwheel=\"{{ onWheelSpecies }}\" title=\"Scroll to spin species\" style=\"position:relative; width:84px; align-self:stretch; flex:0 0 auto; cursor:ns-resize; overscroll-behavior:contain; touch-action:none;\">\n          <sc-for list=\"{{ colorDial }}\" as=\"d\" hint-placeholder-count=\"6\">\n            <button onclick=\"{{ d.onClick }}\" data-nsp=\"{{ d.i }}\" style=\"{{ d.style }}\">{{ d.face }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"text-align:center; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#8f86bd;\">{{ dialHint }}<\u002Fdiv>\n\n      <!-- CONTROLS -->\n      <div style=\"display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:2px;\">\n        <button onclick=\"{{ onRoost }}\" style=\"{{ roostStyle }}\">\n          <div style=\"{{ preview.tokenStyle }}\">\n            {{ preview.face }}\n            <div style=\"{{ preview.numStyle }}\">{{ preview.num }}<\u002Fdiv>\n          <\u002Fdiv>\n          <span>{{ roostLabel }}<\u002Fspan>\n        <\u002Fbutton>\n\n        <div style=\"display:flex; gap:8px; width:100%; max-width:360px;\">\n          <button onclick=\"{{ onClear }}\" style=\"all:unset; cursor:pointer; flex:1; text-align:center; padding:12px; border-radius:12px; background:rgba(255,95,126,.12); border:1px solid rgba(255,95,126,.32); color:#ff9db1; font-weight:600; font-size:13.5px;\">Clear space<\u002Fbutton>\n          <button onclick=\"{{ onUndo }}\" style=\"{{ undoStyle }}\">\u21b6 Undo<\u002Fbutton>\n          <button onclick=\"{{ onRedo }}\" style=\"{{ redoStyle }}\">\u21b7 Redo<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; gap:18px; margin-top:2px;\">\n          <button onclick=\"{{ onHint }}\" style=\"all:unset; cursor:pointer; font-size:12.5px; color:#a9a1d4; border-bottom:1px dotted rgba(255,255,255,.25);\">\ud83d\udca1 Reveal a bat<\u002Fbutton>\n          <button onclick=\"{{ onNewGame }}\" style=\"all:unset; cursor:pointer; font-size:12.5px; color:#a9a1d4; border-bottom:1px dotted rgba(255,255,255,.25);\">\u21bb New cave<\u002Fbutton>\n          <button onclick=\"{{ onBackToMenu }}\" style=\"all:unset; cursor:pointer; font-size:12.5px; color:#a9a1d4; border-bottom:1px dotted rgba(255,255,255,.25);\">Exit<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"text-align:center; font-size:11.5px; color:#6f679a; max-width:420px;\">{{ statusLine }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ================= WIN ================= -->\n  <sc-if value=\"{{ showWin }}\">\n    <div style=\"position:relative; width:100%; max-width:560px; margin:auto; display:flex; flex-direction:column; align-items:center; gap:20px; text-align:center; padding-top:20px;\">\n      <div style=\"position:absolute; inset:-40px 0 auto 0; height:220px; pointer-events:none;\">\n        <sc-for list=\"{{ swarm }}\" as=\"b\" hint-placeholder-count=\"0\">\n          <div style=\"{{ b.style }}\">\ud83e\udd87<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:13px; letter-spacing:3px; text-transform:uppercase; color:#8f86bd; z-index:1;\">Cave cleared<\u002Fdiv>\n      <div style=\"z-index:1; font-size:64px; animation:bd-float 3s ease-in-out infinite;\">{{ rankEmoji }}<\u002Fdiv>\n      <div style=\"z-index:1; font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:clamp(30px,8vw,46px); line-height:1; color:#ece7ff; animation:bd-glow 3s ease-in-out infinite;\">{{ rankTitle }}<\u002Fdiv>\n      <div style=\"z-index:1; max-width:420px; font-size:14.5px; color:#c4bce6; line-height:1.6;\">{{ rankNote }}<\u002Fdiv>\n\n      <div style=\"z-index:1; width:100%; display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:6px;\">\n        <div style=\"padding:16px; border-radius:14px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.09);\"><div style=\"font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#8f86bd;\">Final score<\u002Fdiv><div style=\"font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:30px; color:#ffcf6b;\">{{ finalScore }}<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:16px; border-radius:14px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.09);\"><div style=\"font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#8f86bd;\">Time<\u002Fdiv><div style=\"font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:30px;\">{{ winTime }}<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:16px; border-radius:14px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.09);\"><div style=\"font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#8f86bd;\">Time bonus<\u002Fdiv><div style=\"font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:30px; color:#7ff0e2;\">+{{ timeBonus }}<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:16px; border-radius:14px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.09);\"><div style=\"font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#8f86bd;\">Best combo<\u002Fdiv><div style=\"font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:30px; color:#cbb0ff;\">\u00d7{{ maxCombo }}<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"z-index:1; width:100%; display:flex; gap:10px; margin-top:6px;\">\n        <button onclick=\"{{ onPlayAgain }}\" style=\"all:unset; cursor:pointer; flex:1; text-align:center; padding:16px; border-radius:14px; background:linear-gradient(135deg,#b581ff,#7c4dff); font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:16px; color:#fff;\">Fly again<\u002Fbutton>\n        <button onclick=\"{{ onBackToMenu }}\" style=\"all:unset; cursor:pointer; padding:16px 20px; border-radius:14px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); font-weight:600;\">Menu<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:760},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#ffcf6b&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;sonarColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#b581ff&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;reducedMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Play&quot;}}\">\nconst N = 6;\nconst SPECIES = [\n  { name: 'Vampire',    color: '#ff5f7e', bg: 'rgba(255,95,126,0.18)' },\n  { name: 'Fruit',      color: '#ffb14d', bg: 'rgba(255,177,77,0.18)' },\n  { name: 'Micro',      color: '#33d6c3', bg: 'rgba(51,214,195,0.18)' },\n  { name: 'Horseshoe',  color: '#5aa0ff', bg: 'rgba(90,160,255,0.18)' },\n  { name: 'Flying Fox', color: '#b581ff', bg: 'rgba(181,129,255,0.18)' },\n  { name: 'Bulldog',    color: '#f2f0ff', bg: 'rgba(242,240,255,0.18)' },\n];\nconst DIFF = {\n  roost:    { label: 'Roost',    givens: 22 },\n  twilight: { label: 'Twilight', givens: 16 },\n  midnight: { label: 'Midnight', givens: 11 },\n};\nconst caveOf = (r, c) => Math.floor(r / 2) * 2 + Math.floor(c / 3);\nconst shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      screen: 'menu', difficulty: 'twilight',\n      sol: null, given: null, board: null, errors: {},\n      selected: null, pendSp: 0, pendSz: 1, history: { past: [], future: [] },\n      elapsed: 0, score: 0, wrong: 0, combo: 1, maxCombo: 1, lastCorrect: 0,\n      awardRow: {}, awardCol: {}, awardCave: {},\n      pulse: null, shake: null,\n      celebrate: null,\n      best: this.loadBest(),\n      rank: null, timeBonus: 0, finalScore: 0, winTime: '00:00',\n    };\n  }\n  componentWillUnmount() { clearInterval(this.timer); clearTimeout(this._pt); clearTimeout(this._st); }\n  loadBest() { try { return JSON.parse(localStorage.getItem('batduko_best') || 'null'); } catch (e) { return null; } }\n\n  // ---------- generation ----------\n  adjOK(sp, sz, r, c, s, z, relax) {\n    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {\n      if (!dr && !dc) continue;\n      const nr = r + dr, nc = c + dc;\n      if (nr < 0 || nc < 0 || nr >= N || nc >= N) continue;\n      if (sp[nr][nc] === -1) continue;\n      const diag = dr !== 0 && dc !== 0;\n      if (!diag) { if (relax < 2 && sz[nr][nc] === z) return false; }\n      else { if (relax < 1 && sp[nr][nc] === s) return false; }\n    }\n    return true;\n  }\n  tryFill(relax) {\n    const sp = Array.from({ length: N }, () => Array(N).fill(-1));\n    const sz = Array.from({ length: N }, () => Array(N).fill(0));\n    const rSp = mk(), cSp = mk(), vSp = mk(), rSz = mk(), cSz = mk(), vSz = mk();\n    function mk() { return Array.from({ length: N }, () => Array(6).fill(false)); }\n    let nodes = 0; const BUDGET = 250000;\n    const order = []; for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) order.push([r, c]);\n    const self = this;\n    function bt(k) {\n      if (k === order.length) return true;\n      if (++nodes > BUDGET) throw 'budget';\n      const [r, c] = order[k], cv = caveOf(r, c);\n      const pairs = [];\n      for (let s = 0; s < 6; s++) for (let z = 1; z <= 6; z++) pairs.push([s, z]);\n      shuffle(pairs);\n      for (const [s, z] of pairs) {\n        if (rSp[r][s] || cSp[c][s] || vSp[cv][s]) continue;\n        if (rSz[r][z - 1] || cSz[c][z - 1] || vSz[cv][z - 1]) continue;\n        if (!self.adjOK(sp, sz, r, c, s, z, relax)) continue;\n        sp[r][c] = s; sz[r][c] = z;\n        rSp[r][s] = cSp[c][s] = vSp[cv][s] = true;\n        rSz[r][z - 1] = cSz[c][z - 1] = vSz[cv][z - 1] = true;\n        if (bt(k + 1)) return true;\n        sp[r][c] = -1; sz[r][c] = 0;\n        rSp[r][s] = cSp[c][s] = vSp[cv][s] = false;\n        rSz[r][z - 1] = cSz[c][z - 1] = vSz[cv][z - 1] = false;\n      }\n      return false;\n    }\n    try { return bt(0) ? { sp, sz } : null; } catch (e) { return null; }\n  }\n  genFull() {\n    for (let a = 0; a < 60; a++) { const r = this.tryFill(0); if (r) return r; }\n    for (let a = 0; a < 60; a++) { const r = this.tryFill(1); if (r) return r; }\n    for (let a = 0; a < 200; a++) { const r = this.tryFill(2); if (r) return r; }\n    return this.tryFill(2);\n  }\n  dig(full, keep) {\n    const idxs = shuffle([...Array(36).keys()]);\n    const givenSet = new Set(idxs.slice(0, keep));\n    const given = [], board = [];\n    for (let i = 0; i < 36; i++) {\n      const g = givenSet.has(i);\n      given.push(g);\n      board.push(g ? { sp: full.sp[(i / 6) | 0][i % 6], sz: full.sz[(i / 6) | 0][i % 6] } : null);\n    }\n    return { given, board };\n  }\n\n  // ---------- game flow ----------\n  startGame(diff) {\n    const full = this.genFull();\n    const { given, board } = this.dig(full, DIFF[diff].givens);\n    clearInterval(this.timer);\n    this._szLive = 1; this._spLive = 0;\n    this.setState({\n      screen: 'play', difficulty: diff, sol: full, given, board, errors: {},\n      selected: null, pendSp: 0, pendSz: 1, history: { past: [], future: [] },\n      elapsed: 0, score: 0, wrong: 0, combo: 1, maxCombo: 1, lastCorrect: 0,\n      awardRow: {}, awardCol: {}, awardCave: {}, pulse: null, shake: null,\n    });\n    this.timer = setInterval(() => {\n      if (this.state.screen === 'play') this.setState((s) => ({ elapsed: s.elapsed + 1 }));\n    }, 1000);\n  }\n  selectCell(idx) {\n    if (this.state.screen !== 'play' || this.state.given[idx] || this._flying) return;\n    const cur = this.state.board[idx];\n    const nsp = cur ? cur.sp : this.state.pendSp, nsz = cur ? cur.sz : this.state.pendSz;\n    this._spLive = nsp; this._szLive = nsz;\n    this.setState({ selected: idx, pendSp: nsp, pendSz: nsz });\n  }\n  chooseSp(i) { this._spLive = i; this.setState({ pendSp: i }); }\n  chooseSz(n) { this._szLive = n; this.setState({ pendSz: n }); }\n  stepSz(dir) { const cur = this._szLive != null ? this._szLive : this.state.pendSz; this.chooseSz(((cur - 1 + dir + 6) % 6) + 1); }\n  stepSp(dir) { const cur = this._spLive != null ? this._spLive : this.state.pendSp; this.chooseSp((cur + dir + 6) % 6); }\n  roost() {\n    const idx = this.state.selected;\n    if (idx == null || this.state.given[idx] || this._flying) return;\n    const sp = this.state.pendSp, sz = this.state.pendSz;\n    if (this.props.reducedMotion) { this.placeCell(sp, sz); return; }\n    this._flying = true;\n    this.animateRoost(idx, sp, sz, () => { this._flying = false; this.placeCell(sp, sz); });\n  }\n  animateRoost(idx, sp, sz, done) {\n    const cellEl = document.querySelector('[data-cidx=\"' + idx + '\"]');\n    if (!cellEl) { done(); return; }\n    const cr = cellEl.getBoundingClientRect();\n    const tx = cr.left + cr.width / 2, ty = cr.top + cr.height / 2;\n    const szEl = document.querySelector('[data-nsz=\"' + sz + '\"]');\n    const spEl = document.querySelector('[data-nsp=\"' + sp + '\"]');\n    const srcs = [];\n    [szEl, spEl].forEach((e) => { if (e) { const r = e.getBoundingClientRect(); srcs.push([r.left + r.width / 2, r.top + r.height / 2]); } });\n    if (!srcs.length) srcs.push([tx, ty]);\n    const color = SPECIES[sp].color;\n    const R = Math.max(cr.width, 42) * 1.2;\n    const layer = document.createElement('div');\n    layer.style.cssText = 'position:fixed; inset:0; pointer-events:none; z-index:9999;';\n    document.body.appendChild(layer);\n    let called = false;\n    const finish = () => { if (called) return; called = true; try { layer.remove(); } catch (e) {} done(); };\n    let fin = 0; const n = sz;\n    for (let k = 0; k < n; k++) {\n      const el = document.createElement('div');\n      const S = 18;\n      el.style.cssText = 'position:fixed; left:0; top:0; width:' + S + 'px; height:' + S + 'px; margin:-' + (S / 2) + 'px 0 0 -' + (S / 2) + 'px; border-radius:50%; background:' + color + '; box-shadow:0 0 10px ' + color + ', 0 0 4px #fff inset; will-change:transform,opacity;';\n      layer.appendChild(el);\n      const src = srcs[k % srcs.length];\n      const base = (k / n) * Math.PI * 2;\n      const STEPS = 18, turns = 1.35;\n      const frames = [\n        { transform: 'translate(' + src[0] + 'px,' + src[1] + 'px) scale(.3)', opacity: 0, offset: 0 },\n        { transform: 'translate(' + src[0] + 'px,' + src[1] + 'px) scale(.95)', opacity: 1, offset: 0.08 },\n      ];\n      for (let j = 0; j <= STEPS; j++) {\n        const a = base + (j / STEPS) * turns * Math.PI * 2;\n        const px = tx + Math.cos(a) * R, py = ty + Math.sin(a) * R;\n        frames.push({ transform: 'translate(' + px + 'px,' + py + 'px) scale(1)', opacity: 1, offset: 0.15 + (j / STEPS) * 0.6 });\n      }\n      frames.push({ transform: 'translate(' + tx + 'px,' + ty + 'px) scale(.4)', opacity: 1, offset: 0.92 });\n      frames.push({ transform: 'translate(' + tx + 'px,' + ty + 'px) scale(.1)', opacity: 0, offset: 1 });\n      const anim = el.animate(frames, { duration: 880 + k * 28, easing: 'cubic-bezier(.42,0,.35,1)', fill: 'forwards' });\n      anim.onfinish = () => { if (++fin >= n) finish(); };\n    }\n    setTimeout(finish, 1500);\n  }\n  histSnap() {\n    const s = this.state;\n    return { board: s.board.slice(), errors: { ...s.errors }, score: s.score, wrong: s.wrong, combo: s.combo, maxCombo: s.maxCombo, lastCorrect: s.lastCorrect, awardRow: { ...s.awardRow }, awardCol: { ...s.awardCol }, awardCave: { ...s.awardCave } };\n  }\n  pushPast() {\n    const h = this.state.history || { past: [], future: [] };\n    return { past: [...h.past, this.histSnap()].slice(-80), future: [] };\n  }\n  undo() {\n    const h = this.state.history || { past: [], future: [] };\n    if (!h.past.length || this._flying) return;\n    const prev = h.past[h.past.length - 1];\n    const cur = this.histSnap();\n    this.setState({ ...prev, selected: null, history: { past: h.past.slice(0, -1), future: [cur, ...h.future].slice(0, 80) } });\n  }\n  redo() {\n    const h = this.state.history || { past: [], future: [] };\n    if (!h.future.length || this._flying) return;\n    const next = h.future[0];\n    const cur = this.histSnap();\n    this.setState({ ...next, selected: null, history: { past: [...h.past, cur].slice(-80), future: h.future.slice(1) } });\n  }\n  eraseCell() {\n    const idx = this.state.selected;\n    if (idx == null || this.state.given[idx] || !this.state.board[idx] || this._flying) return;\n    const history = this.pushPast();\n    const board = this.state.board.slice(); board[idx] = null;\n    const errors = { ...this.state.errors }; delete errors[idx];\n    this. atFaceSVG(i) {\n  const sp = SPECIES[i], col = sp.color, bg = sp.bg;\n  const head = `<circle cx=\"50\" cy=\"53\" r=\"29\" fill=\"${bg}\" stroke=\"${col}\" stroke-width=\"4\"/>`;\n  let ears = '', feat = '';\n  switch (i) {\n    case 0: // Vampire \u2014 small sharp close-set ears, no nose-leaf, twin fangs\n      ears = `<path d=\"M41 29 L39 9 L50 27 Z\" fill=\"${col}\"/><path d=\"M59 29 L61 9 L50 27 Z\" fill=\"${col}\"/>`;\n      feat = `<path d=\"M43 67 L47 67 L45 79 Z\" fill=\"#fff\"/><path d=\"M53 67 L57 67 L55 79 Z\" fill=\"#fff\"/>`;\n      break;\n    case 1: // Fruit \u2014 tall rounded fox-ish ears + short snout nub\n      ears = `<ellipse cx=\"33\" cy=\"24\" rx=\"9\" ry=\"15\" fill=\"${col}\" transform=\"rotate(-13 33 24)\"/><ellipse cx=\"67\" cy=\"24\" rx=\"9\" ry=\"15\" fill=\"${col}\" transform=\"rotate(13 67 24)\"/>`;\n      feat = `<ellipse cx=\"50\" cy=\"73\" rx=\"7\" ry=\"5.5\" fill=\"${col}\"/>`;\n      break;\n    case 2: // Micro \u2014 enormous echolocation ears, tiny nose\n      ears = `<path d=\"M40 30 L28 2 L50 26 Z\" fill=\"${col}\"/><path d=\"M60 30 L72 2 L50 26 Z\" fill=\"${col}\"/>`;\n      feat = `<circle cx=\"50\" cy=\"70\" r=\"3\" fill=\"${col}\"/>`;\n      break;\n    case 3: // Horseshoe \u2014 pointed ears + horseshoe nose-leaf\n      ears = `<path d=\"M37 28 L26 9 L48 27 Z\" fill=\"${col}\"/><path d=\"M63 28 L74 9 L52 27 Z\" fill=\"${col}\"/>`;\n      feat = `<path d=\"M41 72 A9 9 0 1 1 59 72\" fill=\"none\" stroke=\"${col}\" stroke-width=\"4\" stroke-linecap=\"round\"/>`;\n      break;\n    case 4: // Flying Fox \u2014 tall upright pointed ears + long fox muzzle\n      ears = `<path d=\"M43 27 L39 4 L52 26 Z\" fill=\"${col}\"/><path d=\"M57 27 L61 4 L48 26 Z\" fill=\"${col}\"/>`;\n      feat = `<path d=\"M50 63 Q41 82 50 91 Q59 82 50 63 Z\" fill=\"${bg}\" stroke=\"${col}\" stroke-width=\"3\"/>`;\n      break;\n    case 5: // Bulldog / fisherman \u2014 small low rounded ears + jowly muzzle\n      ears = `<ellipse cx=\"31\" cy=\"35\" rx=\"9\" ry=\"7\" fill=\"${col}\"/><ellipse cx=\"69\" cy=\"35\" rx=\"9\" ry=\"7\" fill=\"${col}\"/>`;\n      feat = `<ellipse cx=\"43\" cy=\"76\" rx=\"9\" ry=\"7.5\" fill=\"${bg}\" stroke=\"${col}\" stroke-width=\"3\"/><ellipse cx=\"57\" cy=\"76\" rx=\"9\" ry=\"7.5\" fill=\"${bg}\" stroke=\"${col}\" stroke-width=\"3\"/><circle cx=\"50\" cy=\"70\" r=\"2.6\" fill=\"${col}\"/>`;\n      break;\n  }\n  return `<svg viewBox=\"0 0 100 100\" width=\"100%\" height=\"100%\" style=\"overflow:visible; display:block;\">${ears}${head}${feat}<\u002Fsvg>`;\n}\nfunction faceEl(i, glow, inset) {\n  const col = SPECIES[i].color;\n  const v = inset || 0;\n  return React.createElement('div', {\n    style: { position: 'absolute', top: v, left: v, right: v, bottom: v, display: 'flex', alignItems: 'center', justifyContent: 'center', filter: 'drop-shadow(0 0 5px ' + hexA(col, glow ? 0.7 : 0.42) + ')', pointerEvents: 'none' },\n    dangerouslySetInnerHTML: { __html: batFaceSVG(i) },\n  });\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
