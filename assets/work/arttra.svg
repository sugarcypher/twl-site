<svg xmlns="http://www.w3.org/2000/svg"
     width="1600" height="1000" viewBox="-300 0 1600 1000"
     role="img" aria-labelledby="title desc">
  <title id="title">ARTTRA — Pigment into Presence</title>
  <desc id="desc">
    A sculptural letter A made of vermilion, cobalt, and golden
    folded planes, with a flowing pigment ribbon on warm ivory.
  </desc>

  <defs>
    <radialGradient id="paper" gradientUnits="userSpaceOnUse" cx="450" cy="350" r="800">
      <stop stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#e8dfd0"/>
    </radialGradient>

    <linearGradient id="red" x1="0" y1="0" x2="1" y2=".8">
      <stop stop-color="#ffbb83"/>
      <stop offset=".32" stop-color="#f64c32"/>
      <stop offset=".75" stop-color="#bf291f"/>
      <stop offset="1" stop-color="#641f35"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101b52"/>
      <stop offset=".45" stop-color="#253ec1"/>
      <stop offset=".78" stop-color="#527dff"/>
      <stop offset="1" stop-color="#a3d7ee"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2=".3">
      <stop stop-color="#b3432b"/>
      <stop offset=".35" stop-color="#ee9350"/>
      <stop offset=".65" stop-color="#ffe4a1"/>
      <stop offset="1" stop-color="#ce792d"/>
    </linearGradient>

    <linearGradient id="ribbon" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#182269"/>
      <stop offset=".35" stop-color="#425de0"/>
      <stop offset=".62" stop-color="#b283ba"/>
      <stop offset=".82" stop-color="#f27953"/>
      <stop offset="1" stop-color="#ffd28c"/>
    </linearGradient>

    <filter id="blur" x="-.5" y="-1" width="2" height="3">
      <feGaussianBlur stdDeviation="17"/>
    </filter>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72"
                    numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".065"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>

  <!-- Gallery-paper ground -->
  <path fill="url(#paper)" d="M-300 0h1600v1000H-300z"/>

  <!-- Fine exhibition framing -->
  <g fill="none" stroke="#655749" stroke-opacity=".22">
    <path d="M85 145V85h60M855 85h60v60
             M85 855v60h60M855 915h60v-60"/>
    <circle cx="500" cy="400" r="284" stroke-opacity=".09"/>
  </g>

  <!-- Floating-object shadow -->
  <ellipse cx="509" cy="679" rx="226" ry="19"
           fill="#443044" opacity=".20" filter="url(#blur)"/>

  <!-- Pigment sculpture -->
  <g filter="url(#grain)">
    <!-- Rear cobalt fold -->
    <path d="M490 180 553 210 770 637 675 612Z"
          fill="url(#blue)"/>
    <path d="M490 180 514 291 675 612 770 637Z"
          fill="#121c65" opacity=".24"/>

    <!-- Broad vermilion rising plane -->
    <path d="M490 180 514 291 351 645 231 645Z"
          fill="url(#red)"/>

    <!-- Inner cut edge -->
    <path d="M514 291 531 326 376 623 351 645Z"
          fill="#7e2937"/>

    <!-- Light along the ascending ridge -->
    <path d="M231 645 490 180 477 232 251 622Z"
          fill="#ffd1a0" opacity=".58"/>

    <!-- Right-facing illuminated plane -->
    <path d="M514 291 553 210 770 637 714 614Z"
          fill="url(#blue)"/>

    <!-- Folded crossbar -->
    <path d="M332 463 628 428 660 493 309 518Z"
          fill="url(#gold)"/>
    <path d="M309 518 660 493 640 523 330 545Z"
          fill="#983931"/>
    <path d="M332 463 628 428 613 443 326 479Z"
          fill="#ffe2a2" opacity=".76"/>

    <!-- A free brushstroke escaping the geometry -->
    <path d="M231 594
             C322 693 564 701 724 541
             C788 477 794 387 746 331
             C818 365 839 463 773 553
             C641 731 357 760 231 594Z"
          fill="url(#ribbon)"/>

    <!-- Hairline ribbon highlight -->
    <path d="M259 622
             C394 723 638 665 748 537
             C800 477 807 397 766 352"
          fill="none" stroke="#ffe3bb"
          stroke-width="2" opacity=".65"/>

    <!-- Quiet facets -->
    <path d="M490 180 553 210 514 291Z"
          fill="#ffc5a4" opacity=".8"/>
    <path d="M675 612 714 614 770 637Z"
          fill="#a7c8ff" opacity=".6"/>
  </g>

  <!-- Small floating pigment fragment -->
  <path d="M700 224 722 208 731 236 710 250Z"
        fill="#e96441"/>
  <path d="M722 208 731 236 710 250Z"
        fill="#a33137"/>
  <circle cx="286" cy="332" r="4" fill="#3451bd"/>

  <!-- Bespoke-spaced gallery wordmark -->
  <text x="510" y="825" text-anchor="middle"
        font-family="Didot, 'Bodoni MT', 'Times New Roman', serif"
        font-size="88" font-weight="400" letter-spacing="17"
        fill="#29242a">ARTTRA</text>

  <text x="502" y="870" text-anchor="middle"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="15" letter-spacing="5"
        fill="#786b64">arttra.art</text>
</svg>